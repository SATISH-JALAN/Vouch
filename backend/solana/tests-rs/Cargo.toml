[package]
name = "pof-solana-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]

[dev-dependencies]
litesvm = { version = "0.16", features = ["precompiles"] }
litesvm-token = "0.16"
anchor-lang = "1.2.0"
pof-gate = { path = "../programs/pof-gate", features = ["no-entrypoint"] }
pof-credit = { path = "../programs/pof-credit", features = ["no-entrypoint"] }
ed25519-dalek = "2"
blake2b_simd = "1"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = { version = "4", features = ["verify"] }
solana-instruction = "3"
solana-clock = "3"
solana-sdk-ids = "3"
# a builtin standing in for a second consumer program (see `Rogue` in tests/gate.rs)
solana-program-runtime = "4.2"
