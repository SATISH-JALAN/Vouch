[package]
name = "pof-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "pof-verify compiled to WebAssembly. Bytes in, verdict out: no network, no filesystem."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pof-verify = { path = "../pof-verify", default-features = false }
pof-core = { path = "../pof-core" }
wasm-bindgen = "=0.2.128"
serde_json = "1"

# Nothing here draws randomness, but the dependency graph links getrandom; point it at the
# browser so the build links.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
