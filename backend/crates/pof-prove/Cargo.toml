[package]
name = "pof-prove"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Vouch prover: turns a proof request and the holder's own notes into proof.pof. Keys never leave this process."

[features]
default = ["cli"]
cli = ["dep:clap", "dep:indicatif", "dep:ureq", "dep:dirs"]

[[bin]]
name = "pof-prove"
path = "src/bin/pof-prove.rs"
required-features = ["cli"]

[dependencies]
pof-core = { path = "../pof-core" }
pof-zk = { path = "../pof-zk", features = ["prove"] }
pof-anchor = { path = "../pof-anchor", default-features = false }
zcash_note_encryption = "0.4.2"
zip32 = "0.2"
bip39 = "2"
rayon = "1"
voting-circuits = { path = "../../vendor/voting-circuits" }
voting-crypto-deps = { version = "=0.2.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bs58 = "0.5"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }
indicatif = { version = "0.18", optional = true }
ureq = { version = "3", optional = true, features = ["json"] }
dirs = { version = "6", optional = true }

[dev-dependencies]
pof-verify = { path = "../pof-verify", default-features = false }
