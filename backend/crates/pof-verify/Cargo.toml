[package]
name = "pof-verify"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Vouch verifier: six checks, cheapest first, one typed verdict. No network, no filesystem in the library."

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow"]

[[bin]]
name = "pof-verify"
path = "src/bin/pof-verify.rs"
required-features = ["cli"]

[dependencies]
pof-core = { path = "../pof-core" }
pof-zk = { path = "../pof-zk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
